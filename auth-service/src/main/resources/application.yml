server:
  port: 8073

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:AXISDB}
    username: ${ORACLE_USER:auth_user}
    password: ${ORACLE_PASSWORD:password}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:YXhpc2JhbmtpbmdwbGF0Zm9ybXNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjIwMjQ=}
  expiration: 3600000
  refresh-expiration: 86400000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

# AWS Configuration
cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-south-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    elasticache:
      endpoint: ${ELASTICACHE_ENDPOINT:localhost:6379}

logging:
  level:
    com.axisbanking.auth: DEBUG
