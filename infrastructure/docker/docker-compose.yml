version: '3.8'

services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Spring Boot Services
  config-server:
    build: ../../config-server
    ports:
      - "8071:8071"
    environment:
      SERVER_PORT: 8071
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8071/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  eureka-server:
    build: ../../eureka-server
    ports:
      - "8070:8070"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8070

  api-gateway:
    build: ../../api-gateway
    ports:
      - "8072:8072"
    depends_on:
      - eureka-server
      - redis
    environment:
      SERVER_PORT: 8072
      REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  auth-service:
    build: ../../auth-service
    ports:
      - "8073:8073"
    depends_on:
      - eureka-server
      - redis
    environment:
      SERVER_PORT: 8073
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  accounts-service:
    build: ../../accounts-service
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - redis
      - kafka
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  deposits-service:
    build: ../../deposits-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - redis
      - kafka
    environment:
      SERVER_PORT: 8081
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  cards-service:
    build: ../../cards-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - redis
      - kafka
    environment:
      SERVER_PORT: 8082
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  loans-service:
    build: ../../loans-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - redis
      - kafka
    environment:
      SERVER_PORT: 8083
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  investments-service:
    build: ../../investments-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - redis
      - kafka
    environment:
      SERVER_PORT: 8084
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  insurance-service:
    build: ../../insurance-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - redis
      - kafka
    environment:
      SERVER_PORT: 8085
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

  payments-service:
