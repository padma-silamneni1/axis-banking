server:
  port: 8083

spring:
  application:
    name: loans-service
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:AXISDB}
    username: ${ORACLE_USER:loans_user}
    password: ${ORACLE_PASSWORD:password}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: loans-service-group
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:YXhpc2JhbmtpbmdwbGF0Zm9ybXNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjIwMjQ=}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      cloudwatch:
        namespace: AxisBanking/Loans
        enabled: ${CLOUDWATCH_ENABLED:false}

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-south-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}

logging:
  level:
    com.axisbanking.loans: DEBUG
